benchmark:
  name: avss2026_curated_coco
  source_images: official_coco_2017_train_images
  image_size: 640
  seed: 0
  train_epochs: 100
  batch_size: 4
  workers: 8
  optimizer: SGD
  base_learning_rate: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  lr_schedule: cosine
  lrf: 0.01
  amp: true
  input_format: RGB_uint8

augmentation:
  active:
    hsv_augmentation:
      probability: 1.0
      hsv_h: 0.015
      hsv_s: 0.7
      hsv_v: 0.4
  disabled:
    - random_flip
    - random_perspective
    - mosaic
    - two_mosaic
    - half_image
    - copy_paste
    - mixup
    - random_jigsaw_puzzle
    - remove_bboxes
    - random_flip_in_boxes
    - adaptive_histogram_equalization
    - hist_equalized
    - apply_clahe
    - adjust_contrast
    - bilateral_filter
    - bm3d_denoising
    - median_filtering
    - non_local_means_denoising
    - log_transform
    - inverse_log_transform
    - local_normalization
    - edge_enhancement

tasks:
  detector:
    label_format: class_xywh
    data_yaml: detector.data.yaml
  axialor:
    label_format: class_xywh_axis_direction
    data_yaml: axialor.data.yaml
  isegmentator:
    label_format: class_polygon
    data_yaml: isegmentator.data.yaml
  axissegmentator:
    label_format: class_axis_direction_polygon
    data_yaml: axissegmentator.data.yaml

loss_and_assignment:
  reg_max: 16
  bbox_loss: IoUNWDLoss
  iou_ratio: 0.45
  nwd_c: 12.8
  alpha_object: 1.0
  beta_axis: 0.5
  gamma_direction: 0.5
  delta_localisation: 6.0
  topk: 13
  bbox_metric: ciou
  use_aux_in_align: false
  gains:
    box: 7.5
    seg: 7.5
    cls: 0.5
    dfl: 1.5
    axis: 0.5
    direction: 0.5

models:
  YOLOv9e:
    task_variant: detection
  YOLOv9e-aura:
    task_variant: detection_axis_direction
    direction_mode: flat
  YOLOv9e-seg:
    task_variant: detection_instance_segmentation
    mask_coefficients: 32
    prototypes: 256
  YOLOv9e-saura:
    task_variant: detection_instance_segmentation_axis_direction
    direction_mode: flat
    mask_coefficients: 32
    prototypes: 256

